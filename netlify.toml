[build]
  command = "npm run build"

# This app uses middleware, server components that read Firestore at request
# time, and ISR (`revalidate`) — none of which work with a static export.
# The official Next.js runtime plugin serves those correctly; do NOT set
# `publish = "out"` (that would be static-export output and break subdomain
# routing + dynamic profile rendering).
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-DNS-Prefetch-Control = "on"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    # Defense-in-depth against the stored-XSS vectors (link hrefs are also
    # sanitized at the source in app/lib/sanitizeUrl.ts). 'unsafe-inline' is
    # required for Next's hydration/inline styles; it weakens script
    # protection but still blocks loading scripts from foreign origins.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://api.cloudinary.com https://res.cloudinary.com; frame-src 'self' https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
